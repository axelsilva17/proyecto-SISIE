<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - SISIE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            orange: '#F25C05',
                            orangeLight: '#FF7A1A',
                            dark: '#052741',
                            medium: '#1F4E79'
                        },
                        neutral: {
                            light: '#F2F2F2',
                            medium: '#D9D9D9',
                            dark: '#555555'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in-up { animation: fadeInUp 0.4s ease-out forwards; }
        
        .toggle-checkbox:checked {
            right: 0;
            border-color: #F25C05;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #F25C05;
        }
        
        .toggle-switch {
            transition: all 0.3s ease;
        }
        .toggle-switch:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="bg-neutral-light min-h-screen">
    
    <!-- Navbar -->
    <nav class="bg-brand-dark text-white p-4 shadow-lg">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <a href="/index.html" class="flex items-center gap-2 hover:opacity-80 transition">
                <img src="/img/LogoCaja.png" alt="SISIE" class="h-10">
                <span class="font-bold text-lg">SISIE</span>
            </a>
            <div class="flex items-center gap-4">
                <a href="/index.html" class="text-sm hover:text-brand-orange transition">
                    <i class="fas fa-home mr-1"></i> Inicio
                </a>
                <button onclick="logout()" class="text-red-400 hover:text-red-300 text-sm">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto p-4 md:p-6">
        
        <!-- Título -->
        <div class="mb-6 fade-in-up">
            <a href="/index.html" class="inline-flex items-center text-brand-orange hover:text-orange-700 text-sm mb-2">
                <i class="fas fa-arrow-left mr-1"></i> Volver
            </a>
            <h1 class="text-2xl md:text-3xl font-bold text-brand-dark flex items-center gap-3">
                <i class="fas fa-box text-brand-orange"></i>
                Gestión de Productos
            </h1>
            <p class="text-neutral-dark text-sm mt-1">Agregá, editá o deshabilita productos del inventario</p>
        </div>

        <!-- Formulario para cargar producto -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-6 fade-in-up">
            <h2 class="text-lg font-semibold text-brand-dark mb-4 flex items-center gap-2">
                <i class="fas fa-plus-circle text-brand-orange"></i>
                Nuevo Producto
            </h2>
            
            <form id="productoForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Nombre -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nombre *</label>
                    <input type="text" id="nombre" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-orange focus:border-transparent"
                        placeholder="Ej: Taladro Percutor 18V">
                </div>
                
                <!-- Categoría -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Categoría *</label>
                    <select id="categoria" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-orange focus:border-transparent">
                        <option value="">Seleccionar...</option>
                    </select>
                </div>
                
                <!-- Precio -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Precio *</label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">$</span>
                        <input type="number" id="precio" step="0.01" min="0" required
                            class="w-full pl-7 pr-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-orange focus:border-transparent"
                            placeholder="0.00">
                    </div>
                </div>
                
                <!-- Stock -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Stock *</label>
                    <input type="number" id="stock" min="0" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-orange focus:border-transparent"
                        placeholder="0">
                </div>
                
                <!-- Descripción -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Descripción</label>
                    <textarea id="descripcion" rows="2"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-orange focus:border-transparent"
                        placeholder="Descripción opcional del producto..."></textarea>
                </div>
                
                <!-- Botón guardar -->
                <div class="md:col-span-3 flex items-end">
                    <button type="submit" id="btnGuardar"
                        class="w-full bg-brand-orange text-white py-2 px-4 rounded-lg hover:bg-orange-600 focus:outline-none focus:ring-2 focus:ring-brand-orange transition font-medium">
                        <i class="fas fa-save mr-2"></i>Guardar Producto
                    </button>
                </div>
            </form>
            
            <!-- Mensaje -->
            <div id="message" class="mt-4 p-3 rounded-lg hidden"></div>
        </div>

        <!-- Listado de productos -->
        <div class="bg-white rounded-xl shadow-md p-6 fade-in-up">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-brand-dark flex items-center gap-2">
                    <i class="fas fa-list text-brand-orange"></i>
                    Lista de Productos
                </h2>
                <div class="flex gap-2">
                    <input type="text" id="busqueda" 
                        class="px-3 py-1.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-orange"
                        placeholder="Buscar...">
                </div>
            </div>
            
            <!-- Tabla -->
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-neutral-light text-gray-700">
                        <tr>
                            <th class="px-4 py-3 text-left font-semibold">Nombre</th>
                            <th class="px-4 py-3 text-left font-semibold">Categoría</th>
                            <th class="px-4 py-3 text-right font-semibold">Precio</th>
                            <th class="px-4 py-3 text-center font-semibold">Stock</th>
                            <th class="px-4 py-3 text-center font-semibold">Estado</th>
                            <th class="px-4 py-3 text-center font-semibold">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="productosTable">
                        <tr>
                            <td colspan="6" class="px-4 py-8 text-center text-gray-500">
                                <i class="fas fa-spinner fa-spin mr-2"></i>Cargando...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <!-- Paginación -->
            <div class="flex justify-between items-center mt-4 text-sm text-gray-600">
                <span id="paginationInfo">Mostrando 0 productos</span>
                <div class="flex gap-2">
                    <button onclick="loadProductos(currentPage - 1)" id="btnPrev" disabled
                        class="px-3 py-1 border rounded hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <span id="pageIndicator" class="px-3 py-1">1</span>
                    <button onclick="loadProductos(currentPage + 1)" id="btnNext" disabled
                        class="px-3 py-1 border rounded hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </div>
        
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/login.html';

        let currentPage = 1;
        let pageSize = 10;
        let editingId = null;
        let productos = [];

        // Cargar categorías al iniciar
        async function loadCategorias() {
            try {
                const response = await fetch('/api/categorias', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                const select = document.getElementById('categoria');
                
                if (Array.isArray(data) && data.length > 0) {
                    select.innerHTML = '';
                    const defaultOpt = document.createElement('option');
                    defaultOpt.value = '';
                    defaultOpt.textContent = 'Seleccionar...';
                    select.appendChild(defaultOpt);
                    
                    data.forEach(cat => {
                        const opt = document.createElement('option');
                        opt.value = cat.id;
                        opt.textContent = cat.nombreCategoria;
                        select.appendChild(opt);
                    });
                } else {
                    select.innerHTML = '<option value="">No hay categorías</option>';
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // Cargar productos
        async function loadProductos(page = 1) {
            try {
                const response = await fetch(`/api/productos?page=${page}&pageSize=${pageSize}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                // API devuelve { items, total, page, pageSize }
                if (data.items) {
                    productos = data.items;
                    renderTable(data.items);
                    updatePagination(data.total, page, data.pageSize);
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('Error al cargar productos', 'error');
            }
        }

        // Renderizar tabla
        function renderTable(items) {
            const tbody = document.getElementById('productosTable');
            if (items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="px-4 py-8 text-center text-gray-500">No hay productos registrados</td></tr>`;
                return;
            }
            tbody.innerHTML = items.map(p => `
                <tr class="border-b hover:bg-gray-50 transition">
                    <td class="px-4 py-3">
                        <div class="font-medium text-gray-800">${p.nombreProducto}</div>
                        ${p.descripcion ? `<div class="text-xs text-gray-500 truncate max-w-xs">${p.descripcion}</div>` : ''}
                    </td>
                    <td class="px-4 py-3 text-gray-600">${p.nombreCategoria || '-'}</td>
                    <td class="px-4 py-3 text-right font-medium">$${p.precioUnitario.toFixed(2)}</td>
                    <td class="px-4 py-3 text-center">
                        <span class="px-2 py-1 rounded text-xs font-medium ${p.stock <= 5 ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}">
                            ${p.stock}
                        </span>
                    </td>
                    <td class="px-4 py-3 text-center">
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" class="sr-only peer" ${p.activo ? 'checked' : ''} onchange="toggleActivo(${p.id}, this.checked)">
                            <div class="toggle-switch w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-brand-orange rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-brand-orange"></div>
                        </label>
                    </td>
                    <td class="px-4 py-3 text-center">
                        <button onclick="editarProducto(${p.id})" class="text-brand-orange hover:text-orange-700 mx-1" title="Editar">
                            <i class="fas fa-edit"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // Actualizar paginación
        function updatePagination(total, page, pageSize) {
            const totalPages = Math.ceil(total / pageSize);
            document.getElementById('paginationInfo').textContent = `Mostrando ${(page - 1) * pageSize + 1}-${Math.min(page * pageSize, total)} de ${total}`;
            document.getElementById('pageIndicator').textContent = page;
            document.getElementById('btnPrev').disabled = page <= 1;
            document.getElementById('btnNext').disabled = page >= totalPages;
        }

        // Guardar producto (crear o editar)
        document.getElementById('productoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnGuardar');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Guardando...';

            const data = {
                nombreProducto: document.getElementById('nombre').value,
                descripcion: document.getElementById('descripcion').value,
                precioUnitario: parseFloat(document.getElementById('precio').value),
                stock: parseInt(document.getElementById('stock').value),
                idCategoria: parseInt(document.getElementById('categoria').value)
            };

            try {
                const url = editingId ? `/api/productos/${editingId}` : '/api/productos';
                const method = editingId ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    showMessage(editingId ? 'Producto actualizado' : 'Producto guardado', 'success');
                    document.getElementById('productoForm').reset();
                    editingId = null;
                    btn.innerHTML = '<i class="fas fa-save mr-2"></i>Guardar Producto';
                    loadProductos(currentPage);
                } else {
                    const error = await response.json();
                    showMessage(error.message || 'Error al guardar', 'error');
                }
            } catch (error) {
                showMessage('Error de conexión', 'error');
            }
            
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-save mr-2"></i>Guardar Producto';
        });

        // Editar producto
        async function editarProducto(id) {
            const p = productos.find(p => p.id === id);
            if (!p) return;
            
            document.getElementById('nombre').value = p.nombreProducto;
            document.getElementById('descripcion').value = p.descripcion || '';
            document.getElementById('precio').value = p.precioUnitario;
            document.getElementById('stock').value = p.stock;
            document.getElementById('categoria').value = p.idCategoria;
            
            editingId = id;
            document.getElementById('btnGuardar').innerHTML = '<i class="fas fa-save mr-2"></i>Actualizar Producto';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Toggle activo (soft delete) - directo sin confirmación
        async function toggleActivo(id, activo) {
            try {
                // Usar el endpoint PATCH /api/productos/{id}/toggle
                const response = await fetch(`/api/productos/${id}/toggle`, {
                    method: 'PATCH',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.ok) {
                    const result = await response.json();
                    showMessage(result.message, 'success');
                    loadProductos(currentPage);
                } else {
                    const error = await response.json();
                    showMessage(error.message || 'Error al cambiar estado', 'error');
                    // Recargar para volver al estado anterior
                    loadProductos(currentPage);
                }
            } catch (error) {
                showMessage('Error de conexión', 'error');
                loadProductos(currentPage);
            }
        }

        // Busqueda
        document.getElementById('busqueda').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = productos.filter(p => 
                p.nombreProducto.toLowerCase().includes(term) || 
                (p.nombreCategoria && p.nombreCategoria.toLowerCase().includes(term))
            );
            renderTable(filtered);
        });

        // Mostrar mensaje
        function showMessage(msg, type) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.className = `mt-4 p-3 rounded-lg ${type === 'success' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 3000);
        }

        // Logout
        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/login.html';
        }

        // Iniciar
        loadCategorias();
        loadProductos();
    </script>
</body>
</html>
