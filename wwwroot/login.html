<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SISIE</title>
    
    <!-- Speculation Rules - Preload de páginas para navegación más rápida -->
    <script type="speculationrules">
    {
      "prefetch": [
        { "urls": ["/index.html", "/register.html", "/productos.html"] }
      ]
    }
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            orange: '#F25C05',
                            orangeLight: '#FF7A1A',
                            dark: '#052741',
                            medium: '#1F4E79'
                        },
                        neutral: {
                            light: '#F2F2F2',
                            medium: '#D9D9D9',
                            dark: '#555555'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        input:focus { transition: all 0.2s ease-in-out; }
        .loader {
            border: 2px solid transparent;
            border-top: 2px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .shake { animation: shake 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.3s ease-out; }
    </style>
</head>
<body class="bg-neutral-light min-h-screen flex items-center justify-center p-4 relative">
    
    <!-- Logo de fondo -->
    <div class="absolute inset-0 flex items-center justify-center pointer-events-none" style="opacity: 0.20;">
        <img src="/img/Logo de SISIE GROUP.png" alt="" class="max-w-8xl w-full h-auto">
    </div>

    <div class="w-full max-w-md relative z-10">
        
        <!-- Logo arriba de la caja -->
        <div class="flex justify-center mb-6">
            <img src="/img/LogoCaja.png" alt="SISIE" class="h-32 w-auto">
        </div>
        
        <!-- Card Login -->
        <div class="bg-white rounded-xl shadow-xl p-6 md:p-8 border-t-4 border-brand-orange">
            
            <form id="loginForm" class="space-y-5" novalidate>
                <h2 class="text-xl md:text-2xl font-semibold text-brand-dark mb-6 text-center">
                    Iniciar Sesión
                </h2>
                
                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-brand-dark mb-1">Correo</label>
                    <div class="relative">
                        <input 
                            type="email" 
                            id="email" 
                            required
                            placeholder="tu@email.com"
                            class="w-full px-4 py-3 pl-11 text-base md:text-sm border border-neutral-medium rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-orange focus:border-transparent"
                            autocomplete="email"
                        >
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-envelope text-neutral-dark text-sm"></i>
                        </div>
                    </div>
                    <p id="emailError" class="text-red-500 text-xs mt-1 hidden">Email inválido</p>
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block text-sm font-medium text-brand-dark mb-1">Contraseña</label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="password" 
                            required
                            placeholder="••••••••"
                            class="w-full px-4 py-3 pl-11 pr-11 text-base md:text-sm border border-neutral-medium rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-orange focus:border-transparent"
                            autocomplete="current-password"
                        >
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-neutral-dark text-sm"></i>
                        </div>
                        <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-3 flex items-center">
                            <i id="eyeIcon" class="fas fa-eye text-neutral-dark hover:text-brand-dark text-sm"></i>
                        </button>
                    </div>
                    <p id="passwordError" class="text-red-500 text-xs mt-1 hidden">Requerida</p>
                </div>

                <!-- Botón -->
                <button 
                    type="submit"
                    id="submitBtn"
                    class="w-full bg-brand-orange text-white py-3 rounded-lg font-semibold hover:bg-orange-600 transition-colors text-base flex items-center justify-center gap-2 disabled:opacity-75"
                >
                    <span id="btnText">Entrar</span>
                    <div id="btnLoader" class="loader hidden"></div>
                </button>
            </form>

            <!-- Registro link -->
            <p class="mt-6 text-center text-neutral-dark text-sm">
                ¿Sin cuenta? <a href="/register.html" class="text-brand-orange font-medium hover:underline">Regístrate</a>
            </p>

            <!-- Mensaje -->
            <div id="message" class="mt-4 p-4 rounded-lg hidden text-sm fade-in"></div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (token) window.location.href = '/index.html';

        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            eyeIcon.classList.toggle('fa-eye');
            eyeIcon.classList.toggle('fa-eye-slash');
        });

        const emailInput = document.getElementById('email');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');

        emailInput.addEventListener('blur', () => {
            if (emailInput.value.trim() && !emailInput.value.includes('@')) {
                emailError.classList.remove('hidden');
                emailInput.classList.add('border-red-500');
            }
        });
        emailInput.addEventListener('input', () => {
            if (emailInput.value.includes('@')) {
                emailError.classList.add('hidden');
                emailInput.classList.remove('border-red-500');
            }
        });

        passwordInput.addEventListener('blur', () => {
            if (!passwordInput.value) {
                passwordError.classList.remove('hidden');
                passwordInput.classList.add('border-red-500');
            }
        });
        passwordInput.addEventListener('input', () => {
            if (passwordInput.value) {
                passwordError.classList.add('hidden');
                passwordInput.classList.remove('border-red-500');
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');

            let hasError = false;
            if (!email || !email.includes('@')) {
                emailError.classList.remove('hidden');
                emailInput.classList.add('border-red-500', 'shake');
                setTimeout(() => emailInput.classList.remove('shake'), 300);
                hasError = true;
            }
            if (!password) {
                passwordError.classList.remove('hidden');
                passwordInput.classList.add('border-red-500', 'shake');
                setTimeout(() => passwordInput.classList.remove('shake'), 300);
                hasError = true;
            }
            if (hasError) return;

            btnText.innerHTML = '<span class="loader mr-2"></span> Entrando...';
            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                if (data.success) {
                    localStorage.setItem('token', data.token);
                    showMessage('¡Bienvenido!', 'success');
                    setTimeout(() => window.location.href = '/index.html', 1000);
                } else {
                    showMessage(data.message || 'Credenciales inválidas', 'error');
                    btnText.textContent = 'Entrar';
                    submitBtn.disabled = false;
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('Error de conexión: ' + error.message, 'error');
                btnText.textContent = 'Entrar';
                submitBtn.disabled = false;
            }
        });

        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = type === 'success' 
                ? 'mt-4 p-4 rounded-lg bg-green-100 text-green-700 text-sm fade-in'
                : 'mt-4 p-4 rounded-lg bg-red-100 text-red-700 text-sm fade-in';
            messageEl.classList.remove('hidden');
        }
    </script>
</body>
</html>
